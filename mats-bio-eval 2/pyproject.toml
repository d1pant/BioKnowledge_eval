[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bio_eval"
version = "0.1.0"
description = "Inspect evals of GFP beta-barrel orientation and substitution tolerance."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "inspect-ai==0.3.282",
    "python-dotenv",
    # Inspect reaches Together, OpenRouter and OpenAI through the OpenAI client.
    # Without it `inspect eval --model together/...` exits with
    # "TogetherAI API requires optional dependencies".
    "openai>=3.4.0",
]

[project.optional-dependencies]
analysis = [
    "biotite==2.0.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bio_eval = [
    "tasks/gfp_barrel/data/*",
    "tasks/gfp_tolerant_site/data/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "analysis: recomputes geometry from deposited structures",
]
